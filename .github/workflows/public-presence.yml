name: Public Presence

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate organization profile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: repos/emulebb-org-profile
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout organization profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repos/emulebb-org-profile
          persist-credentials: false

      - name: Checkout public-presence authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: emulebb/emulebb-tooling
          ref: efe57c9408953c61a2dda4373d6c006ce688fadd
          path: repos/emulebb-tooling
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15.2'

      - name: Validate contract and generated profile
        run: |
          python -B ../emulebb-tooling/helpers/public-presence.py validate
          python -B ../emulebb-tooling/helpers/public-presence.py check-org-profile --input profile/README.md

      - name: Validate documentation links
        run: |
          python -B ../emulebb-tooling/helpers/check-tooling-doclinks.py \
            --docs-root ../emulebb-tooling/docs \
            profile/README.md
